name: Test Diretta NBA

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Cerca dati partite
        run: |
          python - <<'PY'
          import requests
          import re

          url = "https://www.diretta.it/basket/usa/nba/calendario/"
          html = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=30).text

          for term in ["participant", "eventId", "score", "team"]:
              print("\n==========", term, "==========")
              positions = [m.start() for m in re.finditer(term, html, re.I)]
              for p in positions[:4]:
                  print(html[max(0,p-500):p+1000].replace("\\n"," ")[:1500])

          print("\n========== DATE ==========")
          dates = re.findall(r'20\d\d-\d\d-\d\d', html)
          print("Date trovate:", sorted(set(dates))[:40])

          print("\n========== NOMI NBA ==========")
          for name in ["Lakers", "Celtics", "Warriors", "Bulls", "Knicks"]:
              print(name, html.count(name))
          PY
