                      if attempt < 2:
                          time.sleep(2 * (attempt + 1))
              raise RuntimeError(f'{url}: {error}')

          def season_for(day):
              y, m = int(day[:4]), int(day[5:7])
              return f'{y}-{str(y+1)[-2:]}' if m >= 10 else f'{y-1}-{str(y)[-2:]}'

          def team_name(team):
              return ' '.join(x for x in (team.get('teamCity'), team.get('teamName')) if x) or team.get('teamTricode', 'Team')

          def to_minutes(value):
              if value is None or value == '':
                  return None
              value = str(value)
              if value.startswith('PT'):
                  m = re.match(r'PT(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?', value)
                  if m:
                      return round(int(m.group(1) or 0) + float(m.group(2) or 0) / 60, 2)
              if ':' in value:
                  try:
                      mm, ss = value.split(':', 1)
                      return round(int(mm) + int(ss[:2]) / 60, 2)
                  except Exception:
                      return None
              try:
                  return float(value)
              except Exception:
                  return None

          old = {'schema': 1, 'games': [], 'playerStats': []}
          if OUT.exists():
              try:
                  old = json.loads(OUT.read_text(encoding='utf-8'))
              except Exception as exc:
                  raise SystemExit(f'Archivio esistente non leggibile: {exc}')
          games = {str(g['id']): g for g in old.get('games', []) if g.get('id')}
          stats = {str(s['id']): s for s in old.get('playerStats', []) if s.get('id')}
          found = 0
          errors = []

          for day in days:
              date_key = day.strftime('%Y%m%d')
              try:
                  payload = get_json(f'{BASE}/scoreboard/scoreboard_{date_key}.json')
                  daily = payload.get('scoreboard', {}).get('games', [])
                  for raw in daily:
                      gid = str(raw.get('gameId') or '')
                      if not gid:
                          continue
                      found += 1
                      home, away = raw.get('homeTeam', {}), raw.get('awayTeam', {})
                      status = int(raw.get('gameStatus') or 0)
                      hs, aws = home.get('score'), away.get('score')
                      final = status == 3 and hs is not None and aws is not None
                      game_day = str(raw.get('gameEt') or raw.get('gameDate') or day.isoformat())[:10]
                      previous = games.get(gid, {})
                      games[gid] = {
                          **previous, 'id': gid, 'date': game_day,
                          'season': season_for(game_day),
                          'home': team_name(home), 'away': team_name(away),
                          'homeScore': int(hs) if final else None,
                          'awayScore': int(aws) if final else None,
                          'score': f'{hs}-{aws}' if final else '',
                          'winner': ('H' if int(hs) > int(aws) else 'A' if int(hs) < int(aws) else 'T') if final else '',
                          'total': int(hs) + int(aws) if final else None,
                          'gameStatus': status,
                          'statusText': raw.get('gameStatusText') or ('Finale' if final else 'In corso' if status == 2 else 'In programma'),
                          'source': 'NBA.com official CDN via GitHub Actions',
                          'sourceUrl': f'https://www.nba.com/game/{gid}',
                          'updated': datetime.now(UTC).isoformat()
                      }
                      if final:
                          try:
                              box = get_json(f'{BASE}/boxscore/boxscore_{gid}.json').get('game', {})
                              for side in (box.get('homeTeam', {}), box.get('awayTeam', {})):
                                  for player in side.get('players', []):
                                      st = player.get('statistics', {})
                                      mins = to_minutes(st.get('minutes'))
                                      if mins is None or mins == 0:
                                          continue
                                      name = player.get('name') or ' '.join(x for x in (player.get('firstName'), player.get('familyName')) if x)
                                      pid = str(player.get('personId') or name)
                                      sid = f'{gid}_{pid}'
                                      stats[sid] = {
                                          'id': sid, 'gameId': gid, 'player': name, 'playerId': pid,
                                          'season': season_for(game_day), 'date': game_day,
                                          'team': side.get('teamTricode') or side.get('teamName', ''),
                                          'min': mins, 'pts': st.get('points'),
                                          'reb': st.get('reboundsTotal'), 'ast': st.get('assists'),
                                          'stl': st.get('steals'), 'blk': st.get('blocks'),
                                          'source': 'NBA.com official CDN via GitHub Actions'
                                      }
                              time.sleep(0.25)
                          except Exception as exc:
                              print(f'Box score {gid} non disponibile: {exc}')
                  print(f'{day.isoformat()}: {len(daily)} partite')
              except Exception as exc:
                  errors.append(f'{day.isoformat()}: {exc}')
                  print(errors[-1])
              time.sleep(0.25)

          if found == 0:
              raise SystemExit('ERRORE: nessuna partita ricevuta dal feed NBA. Archivio precedente lasciato invariato. ' + ' | '.join(errors))

          result = {
              'schema': 1,
              'updatedAt': datetime.now(UTC).isoformat(),
              'weekStart': days[0].isoformat(),
              'weekEnd': days[-1].isoformat(),
              'games': sorted(games.values(), key=lambda x: (x.get('date', ''), x.get('id', ''))),
              'playerStats': sorted(stats.values(), key=lambda x: (x.get('date', ''), x.get('player', ''))),
              'collection': {'daysRead': 7-len(errors), 'daysFailed': len(errors), 'gamesInCurrentWeek': found}
          }
          tmp = OUT.with_suffix('.tmp')
          tmp.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          tmp.replace(OUT)
          print(f'OK: {found} partite della settimana; archivio totale {len(result["games"])} partite e {len(result["playerStats"])} statistiche giocatore.')
          if errors:
              print('ATTENZIONE: giorni non letti: ' + ' | '.join(errors))
          PY

