name: Test Diretta NBA

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Individua script calendario
        run: |
          python - <<'PY'
          import requests
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          base = "https://www.diretta.it"
          url = base + "/basket/usa/nba/calendario/"
          html = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=30).text

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      src = dict(attrs).get("src")
                      if src:
                          self.urls.append(urljoin(base, src))

          parser = Scripts()
          parser.feed(html)

          print("SCRIPT TROVATI:", len(parser.urls))
          for script in parser.urls:
              if any(x in script.lower() for x in ["calendar", "season", "tournament", "event", "loader", "module"]):
                  print("\nSCRIPT:", script)
                  try:
                      r = requests.get(script, headers={"User-Agent":"Mozilla/5.0"}, timeout=20)
                      print("STATUS:", r.status_code, "BYTE:", len(r.content))
                      for term in ["pq_graphql", "tournamentStage", "eventId", "calendar"]:
                          if term.lower() in r.text.lower():
                              print("TROVATO:", term)
                  except Exception as e:
                      print("ERRORE:", str(e))
          PY
